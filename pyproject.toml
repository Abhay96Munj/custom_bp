[project]
name = "project"
version = "0.1.0"
description = "this is the boilerplate code for django and react project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Abhay Munj", email = "abhaymunj.20@gmail.com" }
]
dependencies = [
    "django>=5.1.1,<6.0.0",
    "djangorestframework>=3.15.2,<4.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "djangorestframework-simplejwt>=5.3.1,<6.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "dj-database-url>=2.2.0,<3.0.0",
    "redis>=5.1.1,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "django-redis>=6.0.0,<7.0.0",
    "whitenoise>=6.12.0,<7.0.0",
    "drf-spectacular>=0.28.0,<0.29.0",
    "django-cors-headers>=4.6.0,<5.0.0",
    "pillow>=11.1.0,<12.0.0",
]

# This pyproject is a dependency manifest, not an installable package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.0.0,<5.0.0",
    "ruff>=0.6.9,<0.7.0",
    "debugpy>=1.8.1,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
